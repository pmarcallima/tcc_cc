<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trace real da seleção TMA</title>
<style>
:root {color-scheme:light dark; --foreground:light-dark(#18181b,#ededee); --muted-foreground:light-dark(#52525b,#b3b3bd); --border:light-dark(#dedee4,#42424c); --primary:light-dark(#dddde5,#373741); --primary-foreground:var(--foreground); --chart-1:light-dark(#7569c4,#a89bea); --chart-2:light-dark(#986128,#d0aa74); --chart-3:light-dark(#3b7b9b,#83bad4); --chart-4:light-dark(#277b66,#7dc3ab); --font-sans:system-ui,sans-serif; --font-mono:ui-monospace,monospace; --radius:8px}
body {margin:0; color:var(--foreground); font-family:var(--font-sans); font-size:14px}
#tma-traces {display:grid; gap:16px; max-width:1100px; margin:auto}
#tma-traces .controls {display:flex; flex-wrap:wrap; gap:12px; align-items:end}
#tma-traces label {display:grid; gap:5px; min-width:0}
#tma-traces select {max-width:100%; font:inherit; color:var(--foreground); background:var(--primary); border:1px solid var(--border); border-radius:4px; padding:6px}
#tma-traces .main-select {flex:1 1 290px}
#tma-traces h2 {font-size:inherit; font-weight:500; margin:0}
#tma-traces .secondary {color:var(--muted-foreground)}
#tma-traces svg {display:block; width:100%; height:255px; overflow:visible}
#tma-traces svg text {fill:var(--foreground); font-size:12px; font-family:var(--font-sans)}
#tma-traces .legend {display:flex; flex-wrap:wrap; gap:16px}
#tma-traces .swatch {display:inline-block; width:12px; height:12px; margin-right:6px}
#tma-traces .events {display:grid; gap:6px}
#tma-traces .event {text-align:start; color:var(--foreground); font:inherit; background:transparent; border:0; padding:6px 0; overflow-wrap:anywhere}
#tma-traces .event:focus-visible {outline:2px solid var(--chart-1)}
#tma-traces .details {white-space:pre-wrap; overflow-wrap:anywhere; font-family:var(--font-mono); margin:0; font-size:12px; min-height:65px}
#tma-traces .status {overflow-wrap:anywhere}
</style>

  <svg id="trace-chart" role="img" aria-label="Linha do tempo com chamada CPU, APIs CUDA e kernels na GPU"></svg>

const root = document.getElementById('tma-traces');

 const t = data[Number(chooser.value)], check = t.check;
 const calls = t.events.filter(e => e.cat === 'user_annotation');
 const selectedCalls = call.value === 'all' ? calls : [calls[Number(call.value)]];

 let lo = start, hi = end;
 if(windowMode.value === 'gpu' && gpu.length) {lo=Math.min(...gpu.map(e=>e.ts)); hi=Math.max(...gpu.map(e=>e.ts+e.dur)); const pad=Math.max((hi-lo)*.08,.1); lo-=pad; hi+=pad}

 svg.replaceChildren(); svg.setAttribute('viewBox',`0 0 ${width} 255`);
 el('title',{},`${t.id}: ${gpu.length} kernels na janela selecionada`);

 const tickCount = width<440 ? 3 : 5;

 const lane = e => e.cat==='user_annotation'?0:e.cat==='kernel'?2:1;
 ['CPU','API CUDA','GPU'].forEach((label,i)=>el('text',{x:left-10,y:top+28+i*51,'text-anchor':'end'},label));
